events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # ---- Rate limiting zones (per client IP) ----
    limit_req_zone  $binary_remote_addr zone=api:10m      rate=10r/s;
    limit_req_zone  $binary_remote_addr zone=auth:10m     rate=1r/s;
    limit_req_zone  $binary_remote_addr zone=internal:10m rate=1r/m;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    # ---- Bot / scanner blocking by User-Agent ----
    map $http_user_agent $bad_bot {
        default 0;
        ~(AhrefsBot|SemrushBot|MJ12bot|DotBot|PetalBot|Bytespider|DataForSeoBot) 1;
        ~(python-requests|Go-http-client|libwww-perl|curl|wget|scrapy|httpclient) 1;
        ~*(masscan|nmap|nikto|sqlmap|zgrab|nuclei) 1;
        "" 1;
    }

    # ---- WebSocket upgrade helper ----
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ---- Compression ----
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        client_max_body_size 3m;
        limit_conn conn 20;

        # Reject known bad bots / scanners / empty UA
        if ($bad_bot) {
            return 403;
        }

        # Reject uncommon HTTP methods
        if ($request_method !~ ^(GET|POST|PUT|DELETE|PATCH|OPTIONS|HEAD)$) {
            return 405;
        }

        # ---- Security headers (applied to all responses) ----
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # Report-only for now — observe violations before enforcing.
        add_header Content-Security-Policy-Report-Only "default-src 'self'; img-src 'self' https://res.cloudinary.com data:; connect-src 'self' ws: wss:; style-src 'self' 'unsafe-inline'; script-src 'self'" always;

        # ---- robots.txt ----
        location = /robots.txt {
            add_header Content-Type text/plain;
            return 200 "User-agent: *\nDisallow: /api/\nCrawl-delay: 10\n";
        }

        # ---- Block dotfiles (.git, .env, etc.) except .well-known ----
        location ~ /\.(?!well-known) {
            deny all;
        }

        # ---- Auth endpoints (strictest limit) ----
        location /api/auth/ {
            limit_req zone=auth burst=5 nodelay;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://app:5001/api/auth/;
        }

        # ---- Internal machine-to-machine endpoints ----
        location /api/internal/ {
            limit_req zone=internal burst=2 nodelay;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://app:5001/api/internal/;
        }

        # ---- General API ----
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://app:5001/api/;
        }

        # ---- Socket.IO / WebSocket (no rate limiting, long-lived) ----
        location /socket.io/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400;
            proxy_pass http://app:5001/socket.io/;
        }

        # ---- Static asset caching ----
        location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|eot|ico)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # ---- SPA fallback (React Router) ----
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
