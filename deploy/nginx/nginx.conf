# API-only reverse proxy for the split deployment: frontend is on Vercel, this
# nginx is the EC2-side edge shield + TLS terminator in front of `app`.
#
# Adapted from client/blog-versum/nginx.conf (the same-origin SPA+API version) —
# the SPA-serving bits (root/index, try_files fallback, static asset caching,
# mime.types) are removed since no static site is served here; everything else
# (rate limiting, bot blocking, security headers, proxy locations) is unchanged.
#
# Hostname is blogversum-api.duckdns.org — must match the DuckDNS record created
# for this instance and the -d flag passed to certbot when issuing the cert.

events {
    worker_connections 1024;
}

http {
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # ---- Rate limiting zones (per client IP) ----
    limit_req_zone  $binary_remote_addr zone=api:10m      rate=10r/s;
    limit_req_zone  $binary_remote_addr zone=auth:10m     rate=1r/s;
    limit_req_zone  $binary_remote_addr zone=internal:10m rate=1r/m;
    limit_conn_zone $binary_remote_addr zone=conn:10m;

    # ---- Bot / scanner blocking by User-Agent ----
    map $http_user_agent $bad_bot {
        default 0;
        ~(AhrefsBot|SemrushBot|MJ12bot|DotBot|PetalBot|Bytespider|DataForSeoBot) 1;
        ~(python-requests|Go-http-client|libwww-perl|curl|wget|scrapy|httpclient) 1;
        ~*(masscan|nmap|nikto|sqlmap|zgrab|nuclei) 1;
        "" 1;
    }

    # ---- WebSocket upgrade helper ----
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;

    # ---- Plain HTTP: redirect everything to HTTPS ----
    # (Certbot uses --standalone, which runs its own temporary listener on 80
    # after this container is stopped — see EC2 setup steps — so no ACME
    # challenge location is needed here.)
    server {
        listen 80;
        server_name blogversum-api.duckdns.org;
        return 301 https://$host$request_uri;
    }

    # ---- HTTPS: the actual API reverse proxy ----
    server {
        listen 443 ssl;
        server_name blogversum-api.duckdns.org;

        ssl_certificate     /etc/letsencrypt/live/blogversum-api.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/blogversum-api.duckdns.org/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        client_max_body_size 3m;
        limit_conn conn 20;

        # Reject known bad bots / scanners / empty UA
        if ($bad_bot) {
            return 403;
        }

        # Reject uncommon HTTP methods
        if ($request_method !~ ^(GET|POST|PUT|DELETE|PATCH|OPTIONS|HEAD)$) {
            return 405;
        }

        # ---- Security headers ----
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ---- robots.txt: this origin is the API, keep it out of any index ----
        location = /robots.txt {
            add_header Content-Type text/plain;
            return 200 "User-agent: *\nDisallow: /\nCrawl-delay: 10\n";
        }

        # ---- Block dotfiles (.git, .env, etc.) except .well-known ----
        location ~ /\.(?!well-known) {
            deny all;
        }

        # ---- Auth endpoints (strictest limit — brute force / OTP abuse) ----
        location /api/auth/ {
            limit_req zone=auth burst=5 nodelay;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://app:5001/api/auth/;
        }

        # ---- Internal machine-to-machine endpoints (Lambda agent) ----
        location /api/internal/ {
            limit_req zone=internal burst=2 nodelay;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://app:5001/api/internal/;
        }

        # ---- General API ----
        location /api/ {
            limit_req zone=api burst=20 nodelay;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://app:5001/api/;
        }

        # ---- Socket.IO / WebSocket (no rate limiting, long-lived) ----
        location /socket.io/ {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 86400;
            proxy_pass http://app:5001/socket.io/;
        }
    }
}
