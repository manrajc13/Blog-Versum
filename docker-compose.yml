services:
  # API-only reverse proxy + TLS terminator (split deployment: frontend is on
  # Vercel, this is the EC2-side edge shield in front of `app`). Replaces the
  # same-origin `client` container from the single-EC2 architecture — that
  # Dockerfile/nginx.conf still live under client/blog-versum/ if ever needed
  # again, just unused on this branch. See VERCEL_DEPLOYMENT_PLAN.md §4/§5.
  nginx:
    build:
      context: ./deploy/nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro   # Let's Encrypt certs (host-issued via certbot)
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  app:
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - ./server/.env
    # Published for local host-testing convenience (npm run dev talks straight to
    # localhost:5001, no nginx in the loop locally). Safe on EC2 too as long as the
    # security group never opens 5001 to the internet — only `nginx` (80/443) should
    # be internet-reachable there; app:5001 is meant to be reached through it.
    ports:
      - "5001:5001"
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --maxmemory 256mb --maxmemory-policy allkeys-lru
    restart: unless-stopped

  # Long-term memory store for the AI agents (agents/ runs on Lambda and is the
  # ONLY consumer - the Node `app` does not touch this). Unlike `redis` (whose
  # only consumer is on this Compose network and so keeps no `ports:`), postgres
  # MUST publish its port because the Lambda is remote to the Docker network.
  # Access is gated at the EC2 security group: allow 5432 from the Lambda's
  # security group only, never 0.0.0.0/0. See PLAN_LAMBDA_DEPLOY.md (§5, §6).
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - blogverse_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  blogverse_pg_data:
